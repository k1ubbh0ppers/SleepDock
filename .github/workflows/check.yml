name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/check-source.py
      - run: npm ci --ignore-scripts
        working-directory: cross-platform
      - run: npm test
        working-directory: cross-platform
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash macos/scripts/check.sh
      - run: bash macos/scripts/build-app.sh
